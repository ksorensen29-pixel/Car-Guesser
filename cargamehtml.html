<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Guesser Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<style>
h1 {
  text-align: center;
  color: whitesmoke;
  font-size: xx-large;
}
h2 {
  text-align: center;
  color: whitesmoke;
}
p {
  text-align: center;
  color: whitesmoke;
}
div {
  text-align: center;
  color: whitesmoke;
}
img {
  display: block;
  margin: auto;
  width: 50%;
}
button {
  color: rgb(143, 143, 143);
  font-size: 20px;
  background-color: whitesmoke;
  border-radius: 7px;
  padding: 10px 20px;
  margin: 5px;
  cursor: pointer;
  border: none;
  transition: 0.3s;
}

  background-color: rgb(200, 200, 200);
}

  font-size: 18px;
  font-weight: bold;
  margin: 20px 0;
  min-height: 30px;
  color: rgb(100, 200, 100);
}
#score {
  font-size: 20px;
  font-weight: bold;
  margin: 10px 0;
  color: whitesmoke;
}
#multiplayerInfo {
  display: none;
  margin: 10px auto 20px;
  padding: 10px 16px;
  background-color: rgb(80, 80, 80);
  border-radius: 7px;
  max-width: 600px;
}
#multiplayerInfo strong {
  color: rgb(100, 200, 100);
}
#multiplayerStats {
  margin-top: 8px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));

}
#multiplayerStats div {

}
form {
  margin: 20px auto;
  padding: 30px;
  background-color: rgb(80, 80, 80);
  border-radius: 7px;
  display: block;
  max-width: 600px;
  text-align: center;
}
form input[type="text"], form input[type="number"] {
  padding: 12px;
  margin: 10px auto;
  border-radius: 4px;
  border: 1px solid rgb(143, 143, 143);
  width: 100%;
  max-width: 350px;
  font-size: 16px;
  box-sizing: border-box;
}
form input[type="submit"] {
  background-color: whitesmoke;
  color: rgb(143, 143, 143);
  padding: 12px 40px;
  border-radius: 4px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
  font-size: 18px;
  margin-top: 15px;
}
form input[type="submit"]:hover {
  background-color: rgb(200, 200, 200);
}
label {
  color: whitesmoke;
  font-weight: bold;
  display: block;
  margin-top: 10px;
  font-size: 18px;
}
#mapContainer {
  width: 100%;
  max-width: 600px;
  height: 400px;
  margin: 20px auto;
  border-radius: 7px;
  overflow: hidden;
  border: 2px solid rgb(143, 143, 143);
}
#selectedCountry {
  font-size: 16px;
  color: rgb(100, 200, 100);
  font-weight: bold;
  margin-top: 10px;
  text-align: center;
}
</style>
<body style="font-family: sans-serif; background-color:rgb(61, 61, 61);">
    <h1><b>CARGUESSER</b></h1>
    <hr>
    <h2>How to Play</h2>
    <p>Every round you will be provided an image, then you will be prompted to enter its name, production year and country of origin.</p>
    <hr>
    
    <div id="score">Score: 0</div>
    <div id="multiplayerInfo">
      <div>Multiplayer Code: <strong id="multiplayerCode"></strong></div>
      <div id="multiplayerStats">
        <div>Opponent Score: <strong id="opponentScoreValue">0</strong></div>
        <div>Time Left: <strong id="matchTimerValue">02:00</strong></div>
      </div>
      <div id="matchStatus"></div>
      <button onclick="copyMultiplayerCode()">Copy Code</button>
    </div>
    
    <button id="revealBtn" onclick="RevealCurrent()">Reveal</button>
    <button id="skipBtn" onclick="loadRandomCar()">Skip</button>
    <button id="hintBtn" onclick="HintCurrent()">Hint</button>

    <br><br>

    <img id="img" src="" width="400" alt="Car Image">

    <p id="answer"></p>

    <form id="guessForm">
      <label for="fname">Car Name:</label><br>
      <input type="text" id="fname" name="Car Name" list="carSuggestions" required><br>
      <datalist id="carSuggestions"></datalist>
      <label for="lname">Production Year:</label><br>
      <input type="number" id="lname" name="Production Year" list="yearSuggestions" min="1900" max="2100" step="1" required><br>
      <datalist id="yearSuggestions"></datalist>
      <label>Country of Origin (Click on map):</label>
      <div id="mapContainer"></div>
      <div id="selectedCountry">No country selected</div>
      <input type="hidden" id="country" name="Country" required><br><br>
      <input type="submit" value="Submit">
    </form> 

<script type="module">
import { 
  getCurrentUser,
  getMultiplayerGame,
  getMultiplayerGameByCode,
  saveGameScore,
  updateGameScore,
  subscribeToGameUpdates,
  finishMultiplayerGame
} from './supabase-config.js?v=20260521-2';

const MATCH_DURATION_SECONDS = 120;
const LOBBY_REDIRECT_DELAY_MS = 4000;

const cars = [
  { image: "ScriptMats/photos/1.jpeg", name: "Porsche", year: 2020, country: "Germany" },
  { image: "ScriptMats/photos/2.jpeg", name: "Toyota Corolla", year: 2019, country: "Japan" },
  { image: "ScriptMats/photos/3.jpeg", name: "Fiat Punto", year: 2015, country: "Italy" },
  { image: "ScriptMats/photos/4.jpeg", name: "Ferrari SF90 Stradale", year: 2019, country: "Italy" },
  { image: "ScriptMats/photos/5.jpeg", name: "Fiat Multipla", year: 1998, country: "Italy" },
  { image: "ScriptMats/photos/6.jpeg", name: "BMW M5", year: 2021, country: "Germany" },
  { image: "ScriptMats/photos/7.jpeg", name: "Lightning McQueen", year: 2006, country: "United States of America" },
  { image: "ScriptMats/photos/8.jpeg", name: "Mercedes Benz Clase G", year: 1979, country: "Austria" },
  { image: "ScriptMats/photos/9.jpeg", name: "Toyota Prius", year: 1979, country: "Japan" },
  { image: "ScriptMats/photos/10.jpeg", name: "Vintage Ford Model A", year: 1928, country: "United States of America" },
  { image: "ScriptMats/photos/11.jpeg", name: "Packard Twelve 1108 Sport Sedan", year: 1934, country: "United States of America" },
  { image: "ScriptMats/photos/12.jpeg", name: "Pierce-Arrow Silver Arrow", year: 1933, country: "United States of America" },
  { image: "ScriptMats/photos/13.jpeg", name: "Duesenberg Model SSJ", year: 1935, country: "United States of America" },
  { image: "ScriptMats/photos/14.jpeg", name: "Benz Patent Motorwagen", year: 1886, country: "Germany" },
  { image: "ScriptMats/photos/15.jpeg", name: "Maserati 250F", year: 1954, country: "Italy" },
  { image: "ScriptMats/photos/16.jpeg", name: "Mercedes-Benz 300SLR", year: 1995, country: "Germany" }
];

let currentCar = null;
let score = 0;
let map = null;
let geoJsonLayer = null;
let countriesWithCars = [];
let multiplayerContext = null;
let multiplayerGame = null;
let localPlayerNumber = null;
let opponentScore = 0;
let matchEnded = false;
let timerInterval = null;
let matchEndTime = null;
let currentUser = null;
let gameSubscription = null;
let gamePollingInterval = null;
let lobbyRedirectTimeout = null;

function loadMultiplayerContext() {
  const params = new URLSearchParams(window.location.search);
  const gameId = params.get('gameId') || sessionStorage.getItem('multiplayerGameId');
  const gameCode = params.get('gameCode') || sessionStorage.getItem('multiplayerGameCode');
  const role = params.get('role') || sessionStorage.getItem('multiplayerRole');

  if (gameId) sessionStorage.setItem('multiplayerGameId', gameId);
  if (gameCode) sessionStorage.setItem('multiplayerGameCode', gameCode);
  if (role) sessionStorage.setItem('multiplayerRole', role);

  if (gameId || gameCode) {
    multiplayerContext = { gameId, gameCode, role };
    if (gameCode) {
      document.getElementById('multiplayerCode').textContent = gameCode;
      document.getElementById('multiplayerInfo').style.display = 'block';
    }
  }
}

function copyMultiplayerCode() {
  if (!multiplayerContext?.gameCode) {
    alert('No multiplayer code available.');
    return;
  }
  navigator.clipboard.writeText(multiplayerContext.gameCode);
  alert('Game code copied to clipboard!');
}

function determineLocalPlayerNumber(game) {
  if (multiplayerContext?.role === 'host') {
    if (!game?.player_1_id || !currentUser?.id || game.player_1_id === currentUser.id) {
      return 1;
    }
  }
  if (multiplayerContext?.role === 'guest') {
    if (!game?.player_2_id || !currentUser?.id || game.player_2_id === currentUser.id) {
      return 2;
    }
  }
  if (currentUser?.id && game) {
    if (game.player_1_id === currentUser.id) return 1;
    if (game.player_2_id === currentUser.id) return 2;
  }
  return null;
}

function setMatchStatus(message, isError = false) {
  const status = document.getElementById('matchStatus');
  if (!status) return;
  if (!message) {
    status.textContent = '';
    status.style.display = 'none';
    status.className = '';
    return;
  }
  status.textContent = message;
  status.style.display = 'block';
  status.className = isError ? 'error' : '';
}

function setGameplayEnabled(enabled) {
  const form = document.getElementById("guessForm");
  if (form) {
    Array.from(form.elements).forEach(element => {
      element.disabled = !enabled;
    });
  }
  const revealBtn = document.getElementById("revealBtn");
  const skipBtn = document.getElementById("skipBtn");
  const hintBtn = document.getElementById("hintBtn");
  [revealBtn, skipBtn, hintBtn].forEach(button => {
    if (button) button.disabled = !enabled;
  });
}

function initializeMap() {
  // Get list of countries that have cars
  countriesWithCars = [...new Set(cars.map(car => car.country))];
  
  map = L.map('mapContainer').setView([20, 0], 2);
  
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);
  
  fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
    .then(response => {
      if (!response.ok) throw new Error('Failed to load countries data');
      return response.json();
    })
    .then(data => {
      geoJsonLayer = L.geoJson(data, {
        style: function(feature) {
          const countryName = feature.properties.name;
          const hasCarFromCountry = countriesWithCars.includes(countryName);
          
          return {
            color: hasCarFromCountry ? 'rgb(50, 200, 80)' : 'rgb(100, 100, 100)',
            weight: hasCarFromCountry ? 2 : 1,
            opacity: hasCarFromCountry ? 1 : 0.4,
            fillOpacity: hasCarFromCountry ? 0.7 : 0.2,
            fillColor: hasCarFromCountry ? 'rgb(50, 200, 80)' : 'rgb(80, 80, 80)'
          };
        },
        onEachFeature: function(feature, layer) {
          const countryName = feature.properties.name;
          const hasCarFromCountry = countriesWithCars.includes(countryName);
          
          if (hasCarFromCountry) {
            layer.on('click', function() {
              selectCountry(countryName);
            });
            layer.on('mouseover', function() {
              layer.setStyle({ fillOpacity: 0.8, weight: 3 });
            });
            layer.on('mouseout', function() {
              layer.setStyle({ fillOpacity: 0.5, weight: 2 });
            });
          }
        }
      }).addTo(map);
    })
    .catch(error => {
      console.error('Error loading map:', error);
      document.getElementById('mapContainer').innerHTML = '<p style="padding: 20px; color: red;">Error loading map. Please refresh the page.</p>';
    });
}

function selectCountry(countryName) {
  document.getElementById('country').value = countryName;
  document.getElementById('selectedCountry').textContent = 'Selected: ' + countryName;
}

function loadRandomCar() {
  const index = Math.floor(Math.random() * cars.length);
  currentCar = cars[index];

  const imgElement = document.getElementById("img");
  imgElement.src = currentCar.image;
  
  // Add error handling for image loading
  imgElement.onerror = function() {
    document.getElementById("answer").textContent = "⚠️ Image failed to load. Please skip to next car.";
    currentCar = null;
  };
  
  imgElement.onload = function() {
    document.getElementById("answer").textContent = "";
  };
  
  document.getElementById("guessForm").reset();
  document.getElementById("selectedCountry").textContent = "No country selected";
}

function RevealCurrent() {
  if (currentCar !== null) {
    document.getElementById("answer").textContent =
      "Car Name: " + currentCar.name + " | Year: " + currentCar.year + " | Country: " + currentCar.country;
    
    // Auto-fill the form fields
    document.getElementById("fname").value = currentCar.name;
    document.getElementById("lname").value = currentCar.year;
    document.getElementById("country").value = currentCar.country;
    document.getElementById("selectedCountry").textContent = "Selected: " + currentCar.country;
  }
}

function HintCurrent() {
  if (currentCar !== null) {
    const carName = currentCar.name;
    const yearDecade = Math.floor(currentCar.year / 10) * 10;
    const letterCount = carName.length;
    const firstLetter = carName.charAt(0);
    const wordCount = carName.split(' ').length;
    
    // Show number of letters and first letter
    let hint = `🚗 Car: ${letterCount} letters, starts with '${firstLetter}'`;
    
    // Add word count if multi-word
    if (wordCount > 1) {
      hint += ` (${wordCount} words)`;
    }
    
    // Show decade instead of exact year
    hint += ` | 📅 From the ${yearDecade}s`;
    
    document.getElementById("answer").textContent = "Hint: " + hint;
  }
}

function updateScore() {
  document.getElementById("score").textContent = "Score: " + score;
}

function updateOpponentScoreDisplay() {
  const opponentScoreElement = document.getElementById("opponentScoreValue");
  if (!opponentScoreElement) return;
  if (!multiplayerContext?.gameId) return;
  if (!multiplayerGame?.player_2_id && localPlayerNumber === 1) {
    opponentScoreElement.textContent = '—';
    return;
  }
  opponentScoreElement.textContent = opponentScore;
}

function syncScoresFromGame(game) {
  if (!game) return;
  const player1Score = Number.isFinite(game.player_1_score) ? game.player_1_score : 0;
  const player2Score = Number.isFinite(game.player_2_score) ? game.player_2_score : 0;

  if (localPlayerNumber === 1) {
    opponentScore = player2Score;
    if (score !== player1Score) {
      score = player1Score;
      updateScore();
    }
  } else if (localPlayerNumber === 2) {
    opponentScore = player1Score;
    if (score !== player2Score) {
      score = player2Score;
      updateScore();
    }
  }

  updateOpponentScoreDisplay();
}

function formatTime(totalSeconds) {
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

function updateTimerDisplay() {
  const timerElement = document.getElementById('matchTimerValue');
  if (!timerElement) return;
  if (!matchEndTime) {
    timerElement.textContent = '—:—';
    return;
  }
  const remainingSeconds = Math.max(0, Math.ceil((matchEndTime - Date.now()) / 1000));
  timerElement.textContent = formatTime(remainingSeconds);
  if (remainingSeconds <= 0) {
    handleTimerExpired();
  }
}

function clearMatchTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function stopGamePolling() {
  if (gamePollingInterval) {
    clearInterval(gamePollingInterval);
    gamePollingInterval = null;
  }
}

function scheduleLobbyRedirect() {
  if (lobbyRedirectTimeout) return;
  lobbyRedirectTimeout = setTimeout(() => {
    window.location.href = 'dashboard.html';
  }, LOBBY_REDIRECT_DELAY_MS);
}

async function awardWinnerPoint(game) {
  if (!game?.winner_id || !currentUser?.id) return;
  if (game.winner_id !== currentUser.id) return;
  const storageKey = `multiplayerWinRecorded-${game.id}`;
  if (sessionStorage.getItem(storageKey)) return;

  const result = await saveGameScore(currentUser.id, 1, 1, 'multiplayer');
  if (!result.success) {
    console.error('Save multiplayer win error:', result.error);
    return;
  }

  sessionStorage.setItem(storageKey, 'true');
}

function startGamePolling() {
  if (gamePollingInterval) return;
  gamePollingInterval = setInterval(async () => {
    if (!multiplayerContext?.gameId || matchEnded) return;
    const gameResult = await getMultiplayerGame(multiplayerContext.gameId);
    if (gameResult.success && gameResult.data) {
      updateMultiplayerState(gameResult.data);
    }
  }, 3000);
}

function startMatchTimerIfActive(game) {
  if (matchEnded || timerInterval) return;
  if (!game || game.status !== 'active') {
    updateTimerDisplay();
    return;
  }
  const storageKey = `multiplayerStart-${game.id}`;
  let startTime = sessionStorage.getItem(storageKey);
  if (!startTime) {
    startTime = new Date().toISOString();
    sessionStorage.setItem(storageKey, startTime);
  }
  matchEndTime = new Date(startTime).getTime() + MATCH_DURATION_SECONDS * 1000;
  updateTimerDisplay();
  timerInterval = setInterval(updateTimerDisplay, 1000);
}

function buildMatchResultMessage(game) {
  if (!game || !localPlayerNumber) {
    return 'Match over.';
  }
  const player1Score = Number.isFinite(game.player_1_score) ? game.player_1_score : 0;
  const player2Score = Number.isFinite(game.player_2_score) ? game.player_2_score : 0;
  if (player1Score === player2Score) {
    return `Match over — tie (${player1Score}-${player2Score}).`;
  }
  const localScore = localPlayerNumber === 1 ? player1Score : player2Score;
  const opponentFinalScore = localPlayerNumber === 1 ? player2Score : player1Score;
  if (localScore > opponentFinalScore) {
    return `Match over — you win (${localScore}-${opponentFinalScore}).`;
  }
  return `Match over — opponent wins (${localScore}-${opponentFinalScore}).`;
}

function determineWinnerId() {
  if (!multiplayerGame) return null;
  const player1Score = localPlayerNumber === 1 ? score : opponentScore;
  const player2Score = localPlayerNumber === 2 ? score : opponentScore;
  if (player1Score === player2Score) return null;
  return player1Score > player2Score ? multiplayerGame.player_1_id : multiplayerGame.player_2_id;
}

async function finalizeMatchOnServer() {
  if (!multiplayerGame?.id || multiplayerGame.status === 'finished') return;
  const winnerId = determineWinnerId();
  const result = await finishMultiplayerGame(multiplayerGame.id, winnerId);
  if (!result.success) {
    console.error('Finish match error:', result.error);
    setMatchStatus('Time is up, but we could not finalize the match. Please refresh.', true);
    return;
  }
  if (result.data) {
    awardWinnerPoint(result.data);
  }
}

function endMatch(message) {
  if (matchEnded) return;
  matchEnded = true;
  clearMatchTimer();
  stopGamePolling();
  matchEndTime = Date.now();
  updateTimerDisplay();
  setGameplayEnabled(false);
  const baseMessage = message || 'Match over.';
  const finalMessage = multiplayerContext?.gameId
    ? `${baseMessage} Returning to lobby...`
    : baseMessage;
  setMatchStatus(finalMessage);
  if (multiplayerContext?.gameId) {
    scheduleLobbyRedirect();
  }
}

function updateMultiplayerState(game) {
  multiplayerGame = game;
  syncScoresFromGame(game);

  if (game.status === 'waiting') {
    if (!matchEnded) {
      setGameplayEnabled(false);
      clearMatchTimer();
      matchEndTime = null;
      updateTimerDisplay();
      setMatchStatus('Waiting for opponent to join...');
    }
    return;
  }

  if (game.status === 'active') {
    if (!matchEnded) {
      setGameplayEnabled(true);
      setMatchStatus('');
      startMatchTimerIfActive(game);
    }
    return;
  }

  if (game.status === 'finished') {
    endMatch(buildMatchResultMessage(game));
    awardWinnerPoint(game);
  }
}

async function initializeMultiplayer() {
  if (!multiplayerContext?.gameId && !multiplayerContext?.gameCode) return;
  currentUser = await getCurrentUser();
  if (!currentUser) {
    setGameplayEnabled(false);
    setMatchStatus('Please sign in from the dashboard to join multiplayer.', true);
    return;
  }

  let gameResult;
  if (multiplayerContext?.gameId) {
    gameResult = await getMultiplayerGame(multiplayerContext.gameId);
  } else {
    gameResult = await getMultiplayerGameByCode(multiplayerContext.gameCode);
  }
  if (!gameResult.success || !gameResult.data) {
    setGameplayEnabled(false);
    setMatchStatus('Unable to load match data. Please refresh.', true);
    return;
  }

  if (!multiplayerContext?.gameId) {
    multiplayerContext.gameId = gameResult.data.id;
    sessionStorage.setItem('multiplayerGameId', gameResult.data.id);
  }
  if (!multiplayerContext?.gameCode && gameResult.data.game_code) {
    multiplayerContext.gameCode = gameResult.data.game_code;
    sessionStorage.setItem('multiplayerGameCode', gameResult.data.game_code);
    document.getElementById('multiplayerCode').textContent = gameResult.data.game_code;
    document.getElementById('multiplayerInfo').style.display = 'block';
  }

  localPlayerNumber = determineLocalPlayerNumber(gameResult.data);
  if (!localPlayerNumber) {
    setGameplayEnabled(false);
    setMatchStatus('Unable to determine your player role. Please rejoin from the dashboard.', true);
    return;
  }

  updateMultiplayerState(gameResult.data);

  gameSubscription = subscribeToGameUpdates(multiplayerContext.gameId, payload => {
    if (payload?.new) {
      updateMultiplayerState(payload.new);
    }
  });
  startGamePolling();
}

async function syncScoreToServer() {
  if (!multiplayerContext?.gameId || !localPlayerNumber || matchEnded) return;
  const result = await updateGameScore(multiplayerContext.gameId, localPlayerNumber, score);
  if (!result.success) {
    console.error('Sync score error:', result.error);
    setMatchStatus('Score sync failed. Check your connection.', true);
  }
}

function displayCarNames() {
  const carDatalist = document.getElementById("carSuggestions");
  const yearDatalist = document.getElementById("yearSuggestions");
  
  carDatalist.innerHTML = "";
  yearDatalist.innerHTML = "";
  
  // Get unique years
  const uniqueYears = [...new Set(cars.map(car => car.year))].sort((a, b) => a - b);
  
  // Populate car names
  cars.forEach(car => {
    const option = document.createElement("option");
    option.value = car.name;
    carDatalist.appendChild(option);
  });
  
  // Populate years
  uniqueYears.forEach(year => {
    const option = document.createElement("option");
    option.value = year;
    yearDatalist.appendChild(option);
  });
}

window.onload = function() {
  loadMultiplayerContext();
  loadRandomCar();
  updateScore();
  displayCarNames();
  initializeMap();
  if (multiplayerContext?.gameId) {
    initializeMultiplayer();
  } else {
    setGameplayEnabled(true);
  }
};

document.getElementById("guessForm").addEventListener("submit", async function (e) {
  e.preventDefault();

  const guess = document.getElementById("fname").value.trim().toLowerCase();
  const year = parseInt(document.getElementById("lname").value);
  const country = document.getElementById("country").value.trim().toLowerCase();

  if (!currentCar) return;
  if (matchEnded) {
    setMatchStatus('Match is over.');
    return;
  }
  if (multiplayerContext?.gameId && multiplayerGame?.status !== 'active') {
    setMatchStatus('Waiting for opponent to join...');
    return;
  }

  // Validate country is selected
  if (!country) {
    document.getElementById("answer").textContent = "✗ Please select a country from the map.";
    return;
  }

  if (guess === currentCar.name.toLowerCase() &&
      year === currentCar.year &&
      country === currentCar.country.toLowerCase()) {
    score++;
    updateScore();
    await syncScoreToServer();
    document.getElementById("answer").textContent = "✓ Correct! Moving to next car...";
    setTimeout(function() {
      loadRandomCar();
      document.getElementById("img").scrollIntoView({ behavior: "smooth", block: "start" });
    }, 1500);
  } else {
    let feedback = "✗ Incorrect. ";
    if (guess !== currentCar.name.toLowerCase()) {
      feedback += "Car name is wrong. ";
    }
    if (year !== currentCar.year) {
      feedback += "Year is wrong. ";
    }
    if (country !== currentCar.country.toLowerCase()) {
      feedback += "Country is wrong. ";
    }
    document.getElementById("answer").textContent = feedback + "Try again.";
  }
});

function handleTimerExpired() {
  if (matchEnded) return;
  endMatch('Time is up!');
  finalizeMatchOnServer();
}

window.RevealCurrent = RevealCurrent;
window.loadRandomCar = loadRandomCar;
window.HintCurrent = HintCurrent;
window.copyMultiplayerCode = copyMultiplayerCode;
</script>
</body>
</html>
