<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Guesser - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 36px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }

        .email-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d0d5dd;
            border-radius: 5px;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .email-signin-btn {
            width: 100%;
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .email-signin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .email-signin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏎️ CARGUESSER</h1>
    <p class="subtitle">Guess the cars. Compete with friends. Dominate the leaderboard.</p>
    
    <input
        class="email-input"
        id="emailInput"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
    />

    <button class="email-signin-btn" id="signInBtn" onclick="handleEmailSignIn()">
        🔐 Sign in with Email
    </button>

    <div id="status" class="status"></div>
</div>

<script type="module">
    // Import Supabase
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.5/+esm';

    // Initialize Supabase with your credentials
    const SUPABASE_URL = 'https://qauvcttdkbdpnhpcjdog.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_BAliVVfUjkf3zZarqfRTPA_eSRTnEFk';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const dashboardUrl = new URL('dashboard.html', window.location.href).href;

    // Check if user is already logged in
    async function checkUser() {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
            // Redirect to dashboard
            window.location.href = dashboardUrl;
        }
    }

    window.handleEmailSignIn = async function() {
        try {
            const signInBtn = document.getElementById('signInBtn');
            const statusDiv = document.getElementById('status');
            const emailInput = document.getElementById('emailInput');
            const email = emailInput.value.trim();

            if (!email) {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Please enter an email address.';
                return;
            }
            
            signInBtn.disabled = true;
            statusDiv.className = 'status loading';
            statusDiv.textContent = 'Sending sign-in link...';

            const { error } = await supabase.auth.signInWithOtp({
                email,
                options: {
                    emailRedirectTo: window.location.href
                }
            });

            if (error) {
                throw error;
            }

            statusDiv.className = 'status success';
            statusDiv.textContent = 'Check your email for the sign-in link.';
            signInBtn.disabled = false;

        } catch (error) {
            console.error('Sign in error:', error);
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'status error';
            statusDiv.textContent = 'Error: ' + (error.message || 'Sign in failed');
            
            const signInBtn = document.getElementById('signInBtn');
            signInBtn.disabled = false;
        }
    };

    // Check user on page load
    checkUser();

    // Log to verify Supabase is loaded
    console.log('Supabase client initialized');
    console.log('URL:', SUPABASE_URL);
</script>

</body>
</html>
