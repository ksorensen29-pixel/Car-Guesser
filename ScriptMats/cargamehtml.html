<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Guesser Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<style>
h1 {
  text-align: center;
  color: whitesmoke;
  font-size: xx-large;
}
h2 {
  text-align: center;
  color: whitesmoke;
}
p {
  text-align: center;
  color: whitesmoke;
}
div {
  text-align: center;
  color: whitesmoke;
}
img {
  display: block;
  margin: auto;
  width: 50%;
}
button {
  color: rgb(143, 143, 143);
  font-size: 20px;
  background-color: whitesmoke;
  border-radius: 7px;
  padding: 10px 20px;
  margin: 5px;
  cursor: pointer;
  border: none;
  transition: 0.3s;
}
button:hover {
  background-color: rgb(200, 200, 200);
}
#answer {
  font-size: 18px;
  font-weight: bold;
  margin: 20px 0;
  min-height: 30px;
  color: rgb(100, 200, 100);
}
#score {
  font-size: 20px;
  font-weight: bold;
  margin: 10px 0;
  color: whitesmoke;
}
form {
  margin: 20px auto;
  padding: 30px;
  background-color: rgb(80, 80, 80);
  border-radius: 7px;
  display: block;
  max-width: 600px;
  text-align: center;
}
form input[type="text"], form input[type="number"] {
  padding: 12px;
  margin: 10px auto;
  border-radius: 4px;
  border: 1px solid rgb(143, 143, 143);
  width: 100%;
  max-width: 350px;
  font-size: 16px;
  box-sizing: border-box;
}
form input[type="submit"] {
  background-color: whitesmoke;
  color: rgb(143, 143, 143);
  padding: 12px 40px;
  border-radius: 4px;
  border: none;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
  font-size: 18px;
  margin-top: 15px;
}
form input[type="submit"]:hover {
  background-color: rgb(200, 200, 200);
}
label {
  color: whitesmoke;
  font-weight: bold;
  display: block;
  margin-top: 10px;
  font-size: 18px;
}
#mapContainer {
  width: 100%;
  max-width: 600px;
  height: 400px;
  margin: 20px auto;
  border-radius: 7px;
  overflow: hidden;
  border: 2px solid rgb(143, 143, 143);
}
#selectedCountry {
  font-size: 16px;
  color: rgb(100, 200, 100);
  font-weight: bold;
  margin-top: 10px;
  text-align: center;
}
</style>
<body style="font-family: sans-serif; background-color:rgb(61, 61, 61);">
    <h1><b>CARGUESSER</b></h1>
    <hr>
    <h2>How to Play</h2>
    <p>Every round you will be provided an image, then you will be prompted to enter its name, production year and country of origin.</p>
    <hr>
    
    <div id="score">Score: 0</div>
    
    <button onclick="RevealCurrent()">Reveal</button>
    <button onclick="loadRandomCar()">Skip</button>
    <button onclick="HintCurrent()">Hint</button>

    <br><br>

    <img id="img" src="" width="400" alt="Car Image">

    <p id="answer"></p>

    <form id="guessForm">
      <label for="fname">Car Name:</label><br>
      <input type="text" id="fname" name="Car Name" list="carSuggestions" required><br>
      <datalist id="carSuggestions"></datalist>
      <label for="lname">Production Year:</label><br>
      <input type="number" id="lname" name="Production Year" list="yearSuggestions" required><br>
      <datalist id="yearSuggestions"></datalist>
      <label>Country of Origin (Click on map):</label>
      <div id="mapContainer"></div>
      <div id="selectedCountry">No country selected</div>
      <input type="hidden" id="country" name="Country" required><br><br>
      <input type="submit" value="Submit">
    </form> 

<script>
const cars = [
  { image: "photos/1.jpeg", name: "Porsche", year: 2020, country: "Germany" },
  { image: "photos/2.jpeg", name: "Toyota Corolla", year: 2019, country: "Japan" },
  { image: "photos/3.jpeg", name: "Fiat Punto", year: 2015, country: "Italy" },
  { image: "photos/4.jpeg", name: "Ferrari SF90 Stradale", year: 2019, country: "Italy" },
  { image: "photos/5.jpeg", name: "Fiat Multipla", year: 1998, country: "Italy" },
  { image: "photos/6.jpeg", name: "BMW M5", year: 2021, country: "Germany" },
  { image: "photos/7.jpeg", name: "Lightning McQueen", year: 2006, country: "USA" },
  { image: "photos/8.jpeg", name: "Mercedes Benz Clase G", year: 1979, country: "Austria" },
  { image: "photos/9.jpeg", name: "Toyota Prius", year: 1979, country: "Japan" },
  { image: "photos/10.jpeg", name: "Vintage Ford Model A", year: 1928, country: "USA" },
  { image: "photos/11.jpeg", name: "Packard Twelve 1108 Sport Sedan", year: 1934, country: "USA" },
  { image: "photos/12.jpeg", name: "Pierce-Arrow Silver Arrow", year: 1933, country: "USA" },
  { image: "photos/13.jpeg", name: "Duesenberg Model SSJ", year: 1935, country: "USA" },
  { image: "photos/14.jpeg", name: "Benz Patent Motorwagen", year: 1886, country: "Germany" },
  { image: "photos/15.jpeg", name: "Maserati 250F", year: 1954, country: "Italy" },
  { image: "photos/16.jpeg", name: "Mercedes-Benz 300SLR", year: 1995, country: "Germany" }
];

let currentCar = null;
let score = 0;
let map = null;
let geoJsonLayer = null;
let countriesWithCars = [];

function initializeMap() {
  // Get list of countries that have cars
  countriesWithCars = [...new Set(cars.map(car => car.country))];
  
  map = L.map('mapContainer').setView([20, 0], 2);
  
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);
  
  fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
    .then(response => response.json())
    .then(data => {
      geoJsonLayer = L.geoJson(data, {
        style: function(feature) {
          const countryName = feature.properties.ADMIN;
          const hasCarFromCountry = countriesWithCars.includes(countryName);
          
          return {
            color: hasCarFromCountry ? 'rgb(143, 143, 143)' : 'rgb(100, 100, 100)',
            weight: hasCarFromCountry ? 2 : 1,
            opacity: hasCarFromCountry ? 0.8 : 0.4,
            fillOpacity: hasCarFromCountry ? 0.5 : 0.2,
            fillColor: hasCarFromCountry ? 'rgb(100, 150, 100)' : 'rgb(80, 80, 80)'
          };
        },
        onEachFeature: function(feature, layer) {
          const countryName = feature.properties.ADMIN;
          const hasCarFromCountry = countriesWithCars.includes(countryName);
          
          if (hasCarFromCountry) {
            layer.on('click', function() {
              selectCountry(countryName);
            });
            layer.on('mouseover', function() {
              layer.setStyle({ fillOpacity: 0.8, weight: 3 });
            });
            layer.on('mouseout', function() {
              layer.setStyle({ fillOpacity: 0.5, weight: 2 });
            });
          } else {
            layer.on('mouseover', function() {
              layer.bindPopup('No cars from this country').openPopup();
            });
          }
        }
      }).addTo(map);
    });
}

function selectCountry(countryName) {
  document.getElementById('country').value = countryName;
  document.getElementById('selectedCountry').textContent = 'Selected: ' + countryName;
}

function loadRandomCar() {
  const index = Math.floor(Math.random() * cars.length);
  currentCar = cars[index];

  document.getElementById("img").src = currentCar.image;
  document.getElementById("answer").textContent = "";
  document.getElementById("guessForm").reset();
}

function RevealCurrent() {
  if (currentCar !== null) {
    document.getElementById("answer").textContent =
      "Car Name: " + currentCar.name + " | Year: " + currentCar.year + " | Country: " + currentCar.country;
  }
}

function HintCurrent() {
  if (currentCar !== null) {
    const hint = "Country: " + currentCar.country + " | Year: " + currentCar.year;
    document.getElementById("answer").textContent = "Hint: " + hint;
  }
}

function updateScore() {
  document.getElementById("score").textContent = "Score: " + score;
}

function displayCarNames() {
  const carDatalist = document.getElementById("carSuggestions");
  const yearDatalist = document.getElementById("yearSuggestions");
  
  carDatalist.innerHTML = "";
  yearDatalist.innerHTML = "";
  
  // Get unique years
  const uniqueYears = [...new Set(cars.map(car => car.year))].sort((a, b) => a - b);
  
  // Populate car names
  cars.forEach(car => {
    const option = document.createElement("option");
    option.value = car.name;
    carDatalist.appendChild(option);
  });
  
  // Populate years
  uniqueYears.forEach(year => {
    const option = document.createElement("option");
    option.value = year;
    yearDatalist.appendChild(option);
  });
}

window.onload = function() {
  loadRandomCar();
  updateScore();
  displayCarNames();
  initializeMap();
};

document.getElementById("guessForm").addEventListener("submit", function (e) {
  e.preventDefault();

  const guess = document.getElementById("fname").value.trim().toLowerCase();
  const year = parseInt(document.getElementById("lname").value);
  const country = document.getElementById("country").value.trim().toLowerCase();

  if (!currentCar) return;

  if (guess === currentCar.name.toLowerCase() &&
      year === currentCar.year &&
      country === currentCar.country.toLowerCase()) {
    score++;
    updateScore();
    document.getElementById("answer").textContent = "✓ Correct! Moving to next car...";
    setTimeout(loadRandomCar, 1500);
  } else {
    let feedback = "✗ Incorrect. ";
    if (guess !== currentCar.name.toLowerCase()) {
      feedback += "Car name is wrong. ";
    }
    if (year !== currentCar.year) {
      feedback += "Year is wrong. ";
    }
    if (country !== currentCar.country.toLowerCase()) {
      feedback += "Country is wrong. ";
    }
    document.getElementById("answer").textContent = feedback + "Try again.";
  }
});
</script>
</body>
</html>
