<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
</head>
<body>
  <script>
    const path = window.location.pathname;
    const scriptMatsIndex = path.indexOf('/ScriptMats/');
    const appRoot = scriptMatsIndex !== -1 ? path.slice(0, scriptMatsIndex + 1) : '/';
    const target = new URL('dashboard.html', new URL(appRoot, window.location.origin));
    target.search = window.location.search;
    target.hash = window.location.hash;
    window.location.replace(target.href);
  </script>
</body>
</html>
